name: animebox
description: |
  Anime Box is an Anime Client which targets both desktop and Mobile 
  platforms built in Flutter, to ensure users get a fancy experience watching their favorite 
  anime series with friends.

publish_to: 'none' 

version: 0.1.0-alpha+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  logging: ^1.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  json_annotation: ^4.12.0
  dynamic_color: ^1.9.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  settings_ui: ^3.0.1
  shared_preferences: ^2.5.5
  collection: ^1.19.1
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  package_info_plus: ^10.2.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  external_path: ^3.0.0
  dir_picker: ^0.4.1
  go_router: ^17.5.0
  transparent_image: ^2.0.1
  saf: ^2.1.2
  text_scroll: ^0.2.1
  riverpod_annotation: ^4.0.3
  uuid: ^4.6.0
  fuzzy_duplicate_detector: ^1.0.0
  dart_redb:
    git: https://codeberg.org/iWisp360/dart_redb

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  slang_build_runner: ^4.19.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_variable.ttf
  assets:
    - assets/
