commonActions:
  ok: Ok
  done: Listo
  cancel: Cancelar
  proceed: Proceder
  delete: Eliminar
  remove: Remover
  add: Añadir
  default: Predeterminado
  help: Ayuda
  "yes": Sí
  "no": "No"

commonStates:
  none(context=Gender, param=gender):
    male: Ninguno
    female: Ninguna

language:
  title: Idioma
  english: Inglés 
  spanish: Español
  system: 
    title: Sistema
    description: Idioma del sistema
  actual: "@:.spanish"

downloads:
  episode: Episodio

settings:
  pageHeader: Preferencias
  appearance:
    title: Apariencia
    description: Haz la app tuya
    themeMode:
      title: Modo del Tema
      system: Sistema
      light: Claro
      dark: Oscuro

    relativeDates:
      title: Fechas Relativas

    pitchBlack:
      title: Negro Absoluto
      description: Recomendado para pantallas AMOLED

  downloads:
    title: Descargas
    description: Configura cómo Anime Box administra las descargas
    connectivitySection:
      title: Conectividad
      unmeteredNetworksOnly:
        title: Solo Redes de Uso no Medido

    downloaderSection:
      title: Descargador
      episodesFormat:
        title: Formato de los Episodios
        description: Usado para nombrar episodios descargados
        helpText: |
          %d - Fecha relativa de inicio de la descarga.
          %D - Fecha absoluta de inicio de la descarga.
          %e - Nombre del episodio o la palabra "@:downloads.episode".
          %E - La palabra "@:downloads.episode".
          %n - El número del episodio; debe estar presente.

        errorInvalidFormat: Formato Inválido
        errorNoNumberFormat: "'%n' debe estar presente"

      maxConcurrentDownloads:
        title: Máximas Descargas Concurrentes
        description: Configura la cantidad máxima de descargas que se ejecutarán a la vez

      maxDownloadThreads:
        title: Máximos Hilos de Descarga

  library:
    title: Librería
    description: Personaliza la experiencia de tu librería de anime local
    autoUpdateSeriesSection:
      title: Actualizar Series Automáticamente
      enable:
        title: Actualizar tus series automáticamente

      interval:
        title: Intervalo de actualizaciones automáticas
        description: En horas

      allowMeteredNetworks:
        title: Permitir Redes de Uso Medido

      avoidCompletedSeries:
        title: Evitar Series Completadas
        description: No se actualizarán automáticamente series completadas

  servers:
    title: Servidores
    description: Administra tus servidores para obtener anime
    details:
      title: Propiedades del Servidor
      apiUrl: "Url de la API: $url"
      infoUrl: "Url de la Información: $url"
      version: "Versión: $schemaVersion"
      animeSources:
        title: Fuentes de Anime
        information: 
          zero: Este servidor no tiene fuentes
          one: Este servidor tiene $n fuente
          other: Este servidor tiene $n fuentes
          
        details:
          identifier: "Identificador: $sourceId" 
          recommendations(context=HasRecommendations): 
           "yes": "Recomendaciones: $recommendations"
           "no": "Recomendaciones: @:commonStates.none"

          hentai(context=ContainsHentai):
            "yes": "Hentai: @:commonActions.yes"
            "no": "Hentai: @:commonActions.no"

      deleteServer:
        action: Eliminar este servidor
        dialog:
          title: Eliminar servidor
          description: |
            Este servidor será eliminado permanentemente de Anime Box.

            Las series que hayas añadido de este servidor no serán eliminadas.

    state:
      successDeletedServer: El servidor $serverName fue eliminado correctamente
      noDeletedServer: No se eliminó ningún servidor

    listSection:
      title: Lista de servidores
      noServersState: No hay servidores
    
    addServerDialog: 
      action: Añadir servidor
      formLabel: Url de Info. del Servidor
    
    customizationSection:
      disableAddedHentaiSources:
        title: Desactivar Fuentes Hentai
        description: |
          Desactiva las fuentes Hentai al agregar servidores.
          No modifica los servidores existentes.
  
  advanced:
    title: Avanzado
    description: Para usuarios expertos
    logsSection:
      title: Registros
      debugLogs:
        title: Registros de depuración
        description: Aumenta la verbosidad de los registros. Puede reducir el rendimiento.

    networkSection:
      title: Conexión
      userAgent:
        emptyError: El User Agent no puede estar vacío

  about:
    title: Acerca de
    version: Versión v$version
    sourceCode: Código Fuente
    website: Sitio Web
    contribute: Contribuir
    whatsnew: Qué hay de Nuevo
    licenses: Licencias
    credits: Créditos
    checkForUpdates: Chequear Actualizaciones

mainPage:
  navigationWidgets:
    homeLabel: Inicio
    libraryLabel: Mis Animes
    browseLabel: Explorar

browsePage:
  noServersState:
    message: Actualmente no hay servidores
    actionGoToServers: Ir a servidores

  search: 
    global:
      sourcesSearchHint: 
        one: Buscar en $n fuente...
        other: Buscar en $n fuentes...
    results:
      missingUrlDialog:
        header: Url Inexistente
        description: |
          Esta serie no se puede abrir porque el servidor no pudo retornar una url para esta.

          Puedes intentar otra fuente u otro servidor hasta que el administrador del servidor
          solucione esto.
  
  sources:
    navigation:
      popularAnimes: Popular 
      latestAnimes: Recientes
