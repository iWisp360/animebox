commonActions:
  ok: Ok
  done: Done
  cancel: Cancel
  proceed: Proceed
  delete: Delete 
  remove: Remove
  add: Add
  help: Help
  default: Default
  "yes": "Yes"
  "no": "No"

commonStates:
  none(context=Gender, param=gender):
    male: None
    female: None

language:
  title: Language
  english: English
  spanish: Spanish
  unknown: Unknown, using system language
  system:
    title: System
    description: System language
  actual: "@:.english"

downloads:
  episode: Episode

settings:
  pageHeader: Settings
  appearance:
    title: Appearance
    description: Make the app yours
    themeMode:
      title: Theme Mode
      system: System
      light: Light
      dark: Dark

    relativeDates:
      title: Relative Dates

    pitchBlack:
      title: Pitch Black 
      description: Recommended for AMOLED screens

  downloads:
    title: Downloads
    description: Configure how Anime Box manages downloads
    connectivitySection:
      title: Connectivity
      unmeteredNetworksOnly:
        title: Unmetered Networks Only 

    downloaderSection:
      title: Downloader
      episodesFormat:
        title: Episodes Format 
        description: Used to name downloaded episodes 
        helpText: |
          %d - Relative date of start of download.
          %D - Absolute date of start of download.
          %e - Episode's name or the word "@:downloads.episode".
          %E - The word "Episode".
          %n - The episode's number; must be present.

        errorInvalidFormat: Invalid Format
        errorNoNumberFormat: "'%n' must be present"

      maxConcurrentDownloads:
        title: Max Concurrent Downloads
        description: Sets the max amount of downloads that will run at the same time

      maxDownloadThreads:
        title: Max Download Threads 

  library:
    title: Library
    description: Customize the experience of your local anime library
    autoUpdateSeriesSection:
      title: Auto Update Series
      enable:
        title: Update your series automatically

      interval:
        title: Auto updates interval
        description: In hours

      allowMeteredNetworks:
        title: Allow Metered Networks

      avoidCompletedSeries:
        title: Avoid Completed Series
        description: Won't auto update completed series

  servers:
    title: Servers 
    description: Manage your servers to get anime
    details:
      title: Server Properties
      apiUrl: "API Url: $url$endpoint"
      infoUrl: "Info Url: $url$endpoint"
      version: "Version: $schemaVersion"
      animeSources:
        title: Anime Sources
        information: 
          zero: This server has no sources
          one: This server has $n source
          other: This server has $n sources
          
        details:
          identifier: "Identifier: $sourceId" 
          recommendations(context=HasRecommendations): 
           "yes": "Recommendations: $recommendations"
           "no": "Recommendations: @:commonStates.none"

          hentai(context=ContainsHentai):
            "yes": "Hentai: @:commonActions.yes"
            "no": "Hentai: @:commonActions.no"

      deleteServer:
        action: Delete this server
        dialog:
          title: Delete server 
          description: |
            This server will be permanently deleted from Anime Box.

            The series you added from this server won't be deleted.

    state:
      successDeletedServer: The server $serverName was deleted successfully
      noDeletedServer: No server was deleted

    listSection:
      title: Server list
      noServersState: There are no servers
    
    addServerDialog: 
      action: Add server
      formLabel: Server's Info Url
    
    customizationSection:
      disableAddedHentaiSources:
        title: Disable Hentai Sources
        description: |
          Disables Hentai sources when adding servers. 
          Doesn't modify the existing servers

  advanced:
    title: Advanced 
    description: For power users
    logsSection:
      title: Logs 
      debugLogs:
        title: Debug Logs 
        description: Increases the verbosity of the logs. May reduce performance.

    networkSection:
      title: Network 
      userAgent:
        title: User Agent 
        emptyError: The User Agent must not be empty

  about:
    title: About
    version: Version v$version
    sourceCode: Source Code
    website: Website
    contribute: Contribute
    whatsnew: What's new
    licenses: Licenses
    credits: Credits
    checkForUpdates: Check for Updates

mainPage:
  navigationWidgets:
    homeLabel: Home 
    libraryLabel: My Animes 
    browseLabel: Browse 

browsePage:
  noServersState:
    message: There are currently no servers
    actionGoToServers: Go to servers 

  search: 
    global:
      allTheSources: Search on all the sources...
    results:
      missingUrlDialog:
        header: Missing Url 
        description: |
          This serie isn't reachable because the server couldn't return a url for it.

          You can try another source or another server until the server's administrator fixes this.
  
  sources:
    navigation:
      popularAnimes: Popular 
      latestAnimes: Latest
